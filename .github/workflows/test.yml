name: Test SecondCut
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -c requirements.lock.txt
      - run: python -m pytest -q
      - run: python scripts/evaluate.py
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate AWS infrastructure
        run: sam validate --lint --region ap-south-1 --template-file infra/template.yaml
      - name: Build the Lambda container
        run: docker build -t secondcut-ci .
      - name: Verify OpenCV in the Lambda image
        run: >-
          docker run --rm --entrypoint python secondcut-ci -c
          "import cv2; from secondcut.fixtures import fixture; from secondcut.vision import inspect;
          assert cv2.__version__.startswith('5.'); assert inspect(fixture('corner'))['status']=='measured';
          print('Lambda image vision smoke check passed')"
